[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faceswap"
version = "0.1.0.dev0"
description = "Windows Live Face-Swap Virtual Camera"
requires-python = ">=3.12,<3.13"
# numpy: BSD-3-Clause, added in Step 7 (spec §8, §10.3)
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "mypy==2.4.0",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/faceswap"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/faceswap", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
